engines:
  titan:
    active_regimes: ["TRENDING"]
    min_adx: 35
    min_confidence: 0.55
    max_concurrent: 3
    continuation_min_volume: 0.8
    adx_rising_bars: 1
    asset_profiles:
      crypto: { min_adx: 35, confluence_min_factors: 3 }
      equities: { min_adx: 15, confluence_min_factors: 2 }
      metals: { min_adx: 18, confluence_min_factors: 2 }
      indices: { min_adx: 22, confluence_min_factors: 3 }
    trend_follow:
      ema_fast: 21
      ema_slow: 55
      atr_trail_mult: 2.5
      min_volume_ratio: 1.0
    breakout:
      donchian_period: 20
      volume_spike: 1.5
      atr_filter: 0.005
      confirmation_candles: 2
    partial_tp:
      enabled: true
      first_target_pct: 0.50
      first_close_pct: 0.50
      trail_remaining: true
    exit_system:
      tp1_r: 1.0
      tp1_close_fraction: 0.33
      tp2_r: 2.0
      tp2_close_fraction: 0.33
      be_after_tp1: true
      be_buffer_pct: 0.002
      runner_trail_mode: "structure"
      runner_trail_atr_mult: 2.0
      runner_atr_buffer: 0.3
      min_edge: 0.15

  nautilus:
    active_regimes: ["RANGING"]
    max_adx: 25
    min_confidence: 0.55
    max_chop_trades_per_day: 6
    asset_profiles:
      crypto: { max_adx: 25, confluence_min_factors: 2 }
      equities: { max_adx: 20, confluence_min_factors: 2 }
      metals: { max_adx: 22, confluence_min_factors: 2 }
      indices: { max_adx: 20, confluence_min_factors: 3 }
    bb_reversion:
      period: 20
      std: 2.0
      entry_threshold: 0.05
      rsi_oversold: 30
      rsi_overbought: 70
      stop_mult: 1.0
      target: "mid"
    funding_reversion:
      extreme_pctile: 90
      extreme_neg_pctile: 10
      hold_periods: 8
      stop_pct: 0.03
    micro_reversion:
      obi_threshold: 0.55
      rsi_oversold: 35
      rsi_overbought: 65
      boundary_proximity_atr: 0.5
      stop_atr_mult: 0.5
    chop_corr_gap:
      min_correlation: 0.60
      max_adx: 25
      min_spread_zscore: 1.5
      stop_zscore: 3.0
    partial_tp:
      enabled: true
      first_target_pct: 0.40
      first_close_pct: 0.50
      trail_remaining: true

  phoenix:
    active_regimes: ["TRENDING", "RANGING", "VOLATILE"]
    min_confidence: 0.60
    funding_harvest:
      entry_pctile: 95
      confirmation_periods: 2
      exit_pctile: 60
      stop_pct: 0.025
    basis_trade:
      entry_basis_pct: 0.003
      exit_basis_pct: 0.001
      stop_pct: 0.005
      max_duration_hours: 72

  hermes:
    active_regimes: ["TRENDING", "RANGING", "VOLATILE", "CRISIS"]
    min_confidence: 0.65
    news_fetch_interval_s: 60
    llm_backend: "ollama"
    ollama_url: "http://127.0.0.1:11434/api/generate"
    ollama_model: "llama3.1:8b"
    groq_model: "llama-3.3-70b-versatile"
    position_management:
      critical_news_close_immediately: true
      high_news_tighten_sl: true
      positive_news_trail_tp: true
      dynamic_exit_shadow_enabled: true
      dynamic_exit_noop_debug_sample_n: 100
    dynamic_exit:
      # R-multiple thresholds for stage transitions
      r_breakeven: 0.5        # ENTRY -> BREAKEVEN_LOCK at +0.5R
      r_profit_capture: 1.5   # BREAKEVEN_LOCK -> PROFIT_CAPTURE at +1.5R
      r_trend_rider: 3.0      # PROFIT_CAPTURE -> TREND_RIDER at +3.0R
      # ATR multipliers for trailing stop calculation
      atr_mult_profit_capture: 2.0   # Trailing stop distance in PROFIT_CAPTURE stage
      atr_mult_trend_rider: 1.2      # Trailing stop distance in TREND_RIDER stage (tighter)
      # Partial close fractions at stage transitions
      partial_fraction_profit_capture: 0.30  # Close 30% at BREAKEVEN -> PROFIT_CAPTURE
      partial_fraction_trend_rider: 0.20     # Close 20% at PROFIT_CAPTURE -> TREND_RIDER
    feeds:
      crypto: ["coindesk", "cointelegraph", "theblock", "decrypt"]
      finance: ["yahoo_finance", "reuters"]
      regulatory: ["sec_edgar"]

  atlas:
    risk_on_mult: [1.0, 1.5]
    risk_neutral_mult: [0.7, 1.0]
    risk_off_mult: [0.2, 0.5]
    crisis_mult: 0.0

  hydra:
    active_regimes: ["RANGING"]
    min_confidence: 0.60
    max_concurrent: 5
    timeframe: "15m"
    scalp:
      bb_period: 20
      bb_std: 2.0
      rsi_period: 14
      rsi_oversold: 30
      rsi_overbought: 70
      adx_max: 25
      obi_threshold: 0.15
      volume_delta_periods: 3
      min_volume_ratio: 1.2
    execution:
      order_type: "LIMIT"
      chase_attempts: 3
      chase_timeout_s: 10
    targets:
      tp_option: "band_mid"
      tp_fixed_pct: 0.004
      sl_atr_mult: 1.5
      sl_fixed_pct: 0.003
    partial_tp:
      enabled: true
      first_target_pct: 0.30
      first_close_pct: 0.60
      trail_remaining: true

  gemini:
    active_regimes: ["RANGING"]
    min_confidence: 0.60
    max_simultaneous_pairs: 3
    pairs:
      - symbol_a: "BTC/USDT"
        symbol_b: "ETH/USDT"
        pair_id: "BTC_ETH"
      - symbol_a: "BTC/USDT"
        symbol_b: "SOL/USDT"
        pair_id: "BTC_SOL"
      - symbol_a: "ETH/USDT"
        symbol_b: "SOL/USDT"
        pair_id: "ETH_SOL"
    correlation:
      window: 100
      min_correlation: 0.60
      entry_zscore: 2.0
      exit_zscore: 0.5
      max_half_life: 50

  aegean:
    active_regimes: ["TRENDING", "RANGING", "VOLATILE"]
    min_confidence: 0.55
    channel_multipliers:
      trending: 1.0
      ranging: 1.6
      volatile: 2.0
    rsi_smooth_spans:
      trending: 3
      ranging: 5
      volatile: 8
    atr_stop_multipliers:
      trending: 2.2
      ranging: 1.3
      volatile: 1.8
    rr_ratios:
      trending: 2.5
      ranging: 1.8
      volatile: 1.6
    mtf_trend_filter:
      enabled: true
      htf_timeframe: "4h"
      htf_ema_period: 200

  # v2.5 Precision Entry Filter (Phase E)
  precision_filter:
    enabled: true
    grade_a_threshold: 0.80
    grade_b_threshold: 0.65
    grade_c_threshold: 0.50
    grade_d_threshold: 0.35
    min_passing_grade: "D"
    confidence_adjustments:
      grade_a: 0.05
      grade_b: 0.02
      grade_c: 0.00
      grade_d: -0.03
      grade_f: -0.10

  # v2.5 Confluence Filter (multi-factor independent confirmation)
  confluence_filter:
    enabled: true
    min_factors_required: 4
    min_confluence_score: 0.60
    counter_trend_penalty: 0.15

  # v2.5 Trade Quality Classifier (meta-grade A/B/C/D)
  trade_quality:
    enabled: true
    grade_a_threshold: 0.80
    grade_b_threshold: 0.65
    grade_c_threshold: 0.50
    grade_c_min_confidence: 0.55
    allow_grade_c_in_crypto: true

  # v2.5 Adaptive Confidence Floor
  adaptive_confidence:
    enabled: true
    base_min_confidence: 0.55
    lookback: 20
    floor_low: 0.50
    floor_high: 0.70

  # v2.5 Dual-Speed Architecture
  dual_speed:
    accel:
      max_rolling_vol: 0.04
      rolling_vol_window: 24
      max_dd_for_activation: 0.02
      max_slippage_err: 0.001
      slippage_lookback_orders: 10
      min_orders_for_accel: 20

# ── Crypto Fee-Aware Mode ───────────────────────────────────────
crypto_fee:
  enabled: true
  taker_fee_bps: 3.0
  min_rr: 2.0
  min_tp_pct: 0.01
  grade_a_size_mult: 1.25
  titan_min_edge: 0.15
  grade_b_size_mult: 1.10
  mr_max_adx: 22.0
  mr_max_atr_pctl: 0.60
  tp_adx_rising_mult: 1.15
